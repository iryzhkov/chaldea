name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suites:
    name: suite (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, akasha, e2e-1, e2e-2, e2e-3, messaging, davinci, python-vectors]
    env:
      CHALDEA_REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare isolated test directories
        run: |
          test -n "$RUNNER_TEMP"
          export HOME="$RUNNER_TEMP/chaldea/home"
          export TMPDIR="$RUNNER_TEMP/chaldea/tmp"
          test "$HOME" = "$RUNNER_TEMP/chaldea/home"
          test "$TMPDIR" = "$RUNNER_TEMP/chaldea/tmp"
          mkdir -p "$HOME" "$TMPDIR"
          {
            echo "HOME=$HOME"
            echo "XDG_CONFIG_HOME=$HOME/.config"
            echo "XDG_STATE_HOME=$HOME/.local/state"
            echo "XDG_DATA_HOME=$HOME/.local/share"
            echo "XDG_RUNTIME_DIR=$HOME/.cache"
            echo "TMPDIR=$TMPDIR"
            echo "CHALDEA_TEST_SCRATCH=$RUNNER_TEMP/chaldea/tests"
          } >> "$GITHUB_ENV"
      - name: Download and verify pinned T3 stable
        run: |
          sh scripts/ci/install-t3 "$RUNNER_TEMP/chaldea/t3"
          echo "CHALDEA_T3_BIN=$RUNNER_TEMP/chaldea/t3/t3" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Check complete, exact-once E2E file assignment
        run: python3 scripts/ci/e2e-groups.py --check
      - name: Run required suite
        env:
          CI_LANE: ${{ matrix.lane }}
        run: |
          case "$CI_LANE" in
            unit)
              npm run typecheck
              npm run test:unit
              ;;
            akasha) npm run akasha:test ;;
            e2e-1|e2e-2|e2e-3) python3 scripts/ci/e2e-groups.py "$CI_LANE" ;;
            messaging)
              sudo -- env -i PATH="$PATH" /bin/sh test/message/run.sh
              ;;
            davinci)
              sudo -- env -i PATH="$PATH" CHALDEA_DAVINCI_SCRATCH=/root/.cache/da-vinci-artifacts-messaging-ci /bin/sh test/davinci/run.sh
              ;;
            python-vectors)
              python3 --version
              python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), "Python 3.13 is required"'
              python3 -m venv "$TMPDIR/chaldea-access-python"
              "$TMPDIR/chaldea-access-python/bin/python" -m pip install -r test/fixtures/access/requirements.txt
              "$TMPDIR/chaldea-access-python/bin/python" test/fixtures/access/verify.py
              ;;
            *) echo "Unknown required CI lane: $CI_LANE" >&2; exit 1 ;;
          esac

  # Stable branch-protection check. Matrix failures/cancellations cannot skip it.
  test:
    name: test
    if: ${{ always() }}
    needs: [suites]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every suite to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS"])
          if set(needs) != {"suites"} or needs["suites"].get("result") != "success":
              raise SystemExit(f"Required CI suites did not all succeed: {needs}")
          PY
