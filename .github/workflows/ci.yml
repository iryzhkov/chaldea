name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CHALDEA_REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare isolated test directories
        run: |
          mkdir -p "$RUNNER_TEMP/chaldea/home" "$RUNNER_TEMP/chaldea/tmp"
          {
            echo "HOME=$RUNNER_TEMP/chaldea/home"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/chaldea/home/.config"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/chaldea/home/.local/state"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/chaldea/home/.local/share"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/chaldea/home/.cache"
            echo "TMPDIR=$RUNNER_TEMP/chaldea/tmp"
            echo "CHALDEA_TEST_SCRATCH=$RUNNER_TEMP/chaldea/tests"
          } >> "$GITHUB_ENV"
      - name: Download and verify pinned T3 stable
        run: |
          sh scripts/ci/install-t3 "$RUNNER_TEMP/chaldea/t3"
          echo "CHALDEA_T3_BIN=$RUNNER_TEMP/chaldea/t3/t3" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Qualify dedicated-account NATS messaging with pinned T3
        run: sudo -- env -i PATH="$PATH" /bin/sh test/message/run.sh
      - name: Check access v1 vectors independently in Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), "Python 3.13 is required"'
          python3 -m venv "$TMPDIR/chaldea-access-python"
          "$TMPDIR/chaldea-access-python/bin/python" -m pip install -r test/fixtures/access/requirements.txt
          "$TMPDIR/chaldea-access-python/bin/python" test/fixtures/access/verify.py
