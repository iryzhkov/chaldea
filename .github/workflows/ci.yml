name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The end-to-end tests skip themselves without the pinned t3 binary.
      - run: npm test
        env:
          CHALDEA_TEST_SCRATCH: ${{ runner.temp }}/chaldea-test
