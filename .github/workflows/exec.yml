name: exec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
      - name: Prepare isolated test directories
        run: |
          mkdir -p "$RUNNER_TEMP/chaldea/home" "$RUNNER_TEMP/chaldea/tmp"
          {
            echo "HOME=$RUNNER_TEMP/chaldea/home"
            echo "TMPDIR=$RUNNER_TEMP/chaldea/tmp"
            echo "CHALDEA_TEST_SCRATCH=$RUNNER_TEMP/chaldea/tests"
          } >> "$GITHUB_ENV"
      - name: Install sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap passt
          bwrap --version
          pasta --version
          # Same help probe as the reviewed job server: older pasta does not
          # reliably flush --help. The intentionally unknown option exits nonzero.
          pasta --chaldea-option-probe > "$TMPDIR/pasta-help" 2>&1 || true
          for option in --foreground --dns --config-net --no-map-gw --map-host-loopback --no-splice; do
            if ! grep -q -- "$option" "$TMPDIR/pasta-help"; then
              reason="Exec SSH/sandbox E2E unavailable: Ubuntu apt pasta lacks required option $option."
              echo "::notice::$reason"
              echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - run: npm ci --ignore-scripts
      - run: npm run exec:check
      - run: npm run exec:test
      - name: Explain exec SSH and sandbox E2E skip
        run: |
          reason="Exec SSH/sandbox E2E skipped: its reviewed chaldea-job-server and SSH templates are pinned to private chaldea-fleet-config commit 435985308b84c1ad5ee0f3756100b9326a36a604. Hosted fork PR jobs have no deploy key. Exec typecheck/unit tests and the real-T3 E2E suite still run."
          echo "::notice::$reason"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
